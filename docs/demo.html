<style>

  * { box-sizing:border-box; }
  body { margin:0; font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:#222; }
  .demobar { background:#fff7e6; color:#8a6d3b; padding:7px 20px; font-size:13px; border-bottom:1px solid #f0e0b0; }
  header { background:var(--pri); color:#fff; padding:12px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header .sp { flex:1; }
  header select,header input { padding:5px 8px; border-radius:5px; border:1px solid #fff6; background:#ffffff22; color:#fff; }
  .tabs { display:flex; gap:2px; background:#fff; border-bottom:1px solid var(--line); padding:0 12px; flex-wrap:wrap; }
  .tabs button { border:none; background:none; padding:12px 18px; cursor:pointer; font-size:14px; color:#555; border-bottom:3px solid transparent; }
  .tabs button.active { color:var(--pri); border-bottom-color:var(--pri); font-weight:600; }
  main { padding:18px 22px; max-width:1280px; margin:0 auto; }
  .panel { display:none; } .panel.active { display:block; }
  .kpis { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 20px; min-width:150px; }
  .kpi b { display:block; font-size:26px; color:var(--pri); } .kpi span { color:#666; font-size:13px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .card h3{ margin:0 0 10px; font-size:15px; color:var(--pri); }
  table { border-collapse:collapse; width:100%; background:#fff; font-size:13px; border:1px solid var(--line); }
  th,td { border-bottom:1px solid var(--line); padding:7px 10px; text-align:left; }
  th { background:#eef4f8; } tr:hover td { background:#f9fbfd; }
  .tag { padding:1px 8px; border-radius:10px; font-size:12px; }
  .tag.auto{background:#e6f4ec;color:var(--ok);} .tag.pending{background:#fdf3e0;color:var(--warn);}
  .tag.confirmed{background:#e6f0f8;color:var(--pri);} .tag.cancelled{background:#f1f1f1;color:#888;}
  .ok{color:var(--ok);font-weight:600;} .bad{color:var(--bad);font-weight:600;} .muted{color:#888;font-size:12px;}
  button.sm { padding:3px 9px; font-size:12px; border-radius:4px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.sm.ok{color:var(--ok);border-color:var(--ok);} button.sm.bad{color:var(--bad);border-color:var(--bad);}
  #toast{position:fixed;right:18px;bottom:18px;background:#222;color:#fff;padding:11px 16px;border-radius:8px;opacity:0;transition:.3s;font-size:13px;max-width:420px;}
  #toast.show{opacity:.95;}
</style>
</head>

<div class="demobar">📄 离线演示版 · 内置示例数据 · 双击本文件即可打开，无需安装 · 所有操作仅在本页模拟，不影响真实数据。真实对账请用项目的 CLI/Web 工具。</div>
<header>
  <h1>资金对账工作台</h1>
  <label>期间 <select id="period" onchange="reloadAll()"></select></label>
  <span class="sp"></span>
  <span style="font-size:13px;opacity:.85">演示员</span>
</header>
<div class="tabs">
  <button class="active" onclick="tab('overview',this)">概览 · 调节表</button>
  <button onclick="tab('matches',this)">核销记录</button>
  <button onclick="tab('tickets',this)">差异工单</button>
  <button onclick="tab('board',this)">工单看板</button>
  <button onclick="tab('audit',this)">审计留痕</button>
</div>
<main>
  <section id="overview" class="panel active">
    <div class="kpis" id="kpis"></div>
    <div class="card"><h3>银行存款余额调节表</h3><div id="stmt"></div></div>
    <div class="card"><h3>余额勾稽校验</h3><div id="checks"></div></div>
  </section>
  <section id="matches" class="panel">
    <div class="muted" style="margin-bottom:10px">建议核销可「确认/退回」；自动/已确认的可「反核销」。本页为模拟交互。</div>
    <div id="mtable"></div>
  </section>
  <section id="tickets" class="panel"><div id="ttable"></div></section>
  <section id="board" class="panel"><div class="card"><h3>工单看板（责任方 × 状态，未解决）</h3><div id="btable"></div></div></section>
  <section id="audit" class="panel"><div class="card"><h3>审计留痕（自动 system / 人工记工号）</h3><div id="atable"></div></div></section>
</main>

const $=id=>document.getElementById(id);
function P(){return $('period').value;}
function cur(){return DATA.by_period[P()];}
function toast(m,bad){const t=$('toast');t.textContent=m;t.className='show';t.style.background=bad?'#a33':'#222';setTimeout(()=>t.className='',3000);}
function tab(id,btn){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}

function kpis(){const c=cur(),s=c.summary;
  const pending=c.matches.filter(m=>m.status==='pending').length;
  const auto=c.matches.filter(m=>m.status==='auto'||m.status==='confirmed').length;
  const openT=c.tickets.filter(t=>t.status!=='已解决').length;
  return [['银行核销率',s.rate_bank+'%',`${s.matched_bank}/${s.total_bank} 笔`],
    ['凭证核销率',s.rate_fin+'%',`${s.matched_fin}/${s.total_fin} 行`],
    ['生效核销',auto,'笔'],['建议待确认',pending,'笔'],
    ['未匹配',s.unmatched_bank+' / '+s.unmatched_fin,'银行/凭证'],
    ['未解决工单',openT,'共 '+c.tickets.length+' 张']];
}
function render(){
  const a=document.querySelector('.panel.active').id, c=cur();
  if(a==='overview'){
    $('kpis').innerHTML=kpis().map(k=>`<div class="kpi"><b>${k[1]}</b><span>${k[0]} · ${k[2]}</span></div>`).join('');
    let h='<table><tr><th>账号</th><th>对账单期末</th><th>+企业已收银行未收</th><th>−企业已付银行未付</th><th>调节后对账单</th><th>账面期末</th><th>+银行已收企业未收</th><th>−银行已付企业未付</th><th>调节后账面</th><th>容差差额</th><th>未解释差异</th><th>校验</th></tr>';
    c.summary.statements.forEach(s=>{h+=`<tr><td>${s.account_no}</td>`+(s.has_balance?
      `<td>${s.stmt_close}</td><td>${s.fin_in_pending}</td><td>${s.fin_out_pending}</td><td>${s.adjusted_stmt}</td><td>${s.ledger_close}</td><td>${s.bank_in_unbooked}</td><td>${s.bank_out_unbooked}</td><td>${s.adjusted_ledger}</td><td>${s.tolerance_total}</td><td>${s.residual}</td><td>${s.balanced?'<span class=ok>✓ 平衡</span>':'<span class=bad>✗ 未解释</span>'}</td>`
      :`<td colspan=11 class=muted>未导入余额表</td>`)+'</tr>';});
    $('stmt').innerHTML=h+'</table>';
    $('checks').innerHTML=c.summary.balance_checks.length?('<table><tr><th>账号</th><th>侧</th><th>应等于期末</th><th>实际期末</th><th>结果</th></tr>'+
      c.summary.balance_checks.map(r=>`<tr><td>${r.account_no}</td><td>${r.side==='bank'?'银行对账单':'账面'}</td><td>${r.expected}</td><td>${r.actual}</td><td>${r.ok?'<span class=ok>✓</span>':'<span class=bad>✗</span>'}</td></tr>`).join('')+'</table>'):'<span class=muted>无</span>';
  }
  if(a==='matches'){let h='<table><tr><th>ID</th><th>方式</th><th>置信度</th><th>状态</th><th>对账码</th><th>银行合计</th><th>凭证合计</th><th>差额</th><th>说明</th><th>操作</th></tr>';
    c.matches.forEach(m=>{let btn='';
      if(m.status==='pending')btn=`<button class="sm ok" onclick="cf(${m.id})">确认</button> <button class="sm bad" onclick="rj(${m.id})">退回</button>`;
      else if(m.status==='auto'||m.status==='confirmed')btn=`<button class="sm bad" onclick="um(${m.id})">反核销</button>`;
      h+=`<tr><td>${m.id}</td><td>${m.method}</td><td>${m.confidence}</td><td><span class="tag ${m.status}">${m.status_label}</span></td><td>${m.recon_code}</td><td>${m.bank_total}</td><td>${m.fin_total}</td><td>${m.diff}</td><td class=muted>${m.explanation}</td><td>${btn}</td></tr>`;});
    $('mtable').innerHTML=h+'</table>';}
  if(a==='tickets'){const NEXT={'待派单':['待处理'],'待处理':['处理中','已结转'],'处理中':['待复核','已结转'],'待复核':['已解决','处理中'],'已结转':['已解决']};
    let h='<table><tr><th>ID</th><th>状态</th><th>原因</th><th>责任方</th><th>建议动作</th><th>差异金额</th><th>对账码</th><th>AI 归因</th><th>流转</th></tr>';
    c.tickets.forEach(t=>{let mv=(NEXT[t.status]||[]).map(s=>`<button class="sm" onclick="mt(${t.id},'${s}')">${s}</button>`).join(' ');
      h+=`<tr><td>${t.id}</td><td>${t.status}</td><td>${t.reason_label}</td><td>${t.assignee}</td><td>${t.action}</td><td>${t.diff}</td><td>${t.recon_code}</td><td class=muted>${t.ai_note||t.resolved}</td><td>${mv}</td></tr>`;});
    $('ttable').innerHTML=h+'</table>';}
  if(a==='board'){const open=c.tickets.filter(t=>t.status!=='已解决');const agg={};
    open.forEach(t=>{const k=t.assignee+'|'+t.status;agg[k]=(agg[k]||0)+1;});
    $('btable').innerHTML=Object.keys(agg).length?('<table><tr><th>责任方</th><th>状态</th><th>数量</th></tr>'+Object.entries(agg).map(([k,v])=>{const[a,s]=k.split('|');return `<tr><td>${a}</td><td>${s}</td><td>${v}</td></tr>`;}).join('')+'</table>'):'<p class=muted>无未解决工单</p>';}
  if(a==='audit'){$('atable').innerHTML='<table><tr><th>时间</th><th>操作人</th><th>动作</th><th>对象</th><th>详情</th></tr>'+DATA.audit.map(r=>`<tr><td>${r.at}</td><td>${r.actor}</td><td>${r.action}</td><td>${r.object_type} ${r.object_id||''}</td><td class=muted>${(r.detail||'').slice(0,70)}</td></tr>`).join('')+'</table>';}
}
function reloadAll(){render();}
function logAudit(actor,action,obj,id){DATA.audit.unshift({at:new Date().toISOString().slice(0,19),actor,action,object_type:obj,object_id:id,detail:'（演示模拟）'});}
function cf(id){const m=cur().matches.find(x=>x.id===id);m.status='confirmed';m.status_label='已确认核销';logAudit('演示员','match_confirm','match',id);toast('核销 '+id+' 已确认（模拟）');render();}
function rj(id){const m=cur().matches.find(x=>x.id===id);m.status='cancelled';m.status_label='已撤销';logAudit('演示员','match_reject','match',id);toast('核销 '+id+' 已退回（模拟）');render();}
function um(id){const m=cur().matches.find(x=>x.id===id);m.status='cancelled';m.status_label='已撤销';logAudit('演示员','match_unmatch','match',id);toast('核销 '+id+' 已反核销（模拟）');render();}
function mt(id,to){const t=cur().tickets.find(x=>x.id===id);if(to==='处理中'&&t.status==='待复核'){if(!prompt('退回原因？'))return;}t.status=to;logAudit('演示员','ticket_move','ticket',id);toast('工单 '+id+' → '+to+'（模拟）');render();}

(function boot(){const sel=$('period');DATA.periods.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o);});render();})();
</script>
